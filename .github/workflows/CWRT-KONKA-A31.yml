name: KONKA A31

on:
  workflow_dispatch:
    inputs:
      source:
        description: Source to build
        type: choice
        options:
          - both
          - chasey-25.12
          - yuzhii-6.6
        default: both
      config_only:
        description: Only resolve and audit configuration
        type: boolean
        default: false
  push:
    paths:
      - '.github/workflows/CWRT-KONKA-A31.yml'
      - '.github/scripts/a31-*'
      - 'Config/KONKA-A31/**'

permissions:
  contents: read

concurrency:
  group: a31-${{ github.ref }}-${{ inputs.source || 'both' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: matrix
        env:
          SELECTED_SOURCE: ${{ inputs.source || 'both' }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          entries = json.loads(Path('Config/KONKA-A31/sources.json').read_text())
          selected = os.environ['SELECTED_SOURCE']
          entries = [entry for entry in entries if selected == 'both' or entry['source'] == selected]
          assert entries
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps(entries) + '\n')
          PY
  build:
    needs: plan
    name: A31 / ${{ matrix.source }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      SOURCE_ID: ${{ matrix.source }}
      SOURCE_REPO: ${{ matrix.repo }}
      SOURCE_BRANCH: ${{ matrix.branch }}
      SOURCE_REVISION: ${{ matrix.revision }}
      FORCE_UNSAFE_CONFIGURE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare build host
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential bzip2 ca-certificates ccache clang cmake cpio curl \
            device-tree-compiler file flex g++-multilib gawk gcc-multilib gettext git \
            genisoimage jq libbpf-dev libclang-dev libdw-dev libelf-dev \
            libncurses-dev libssl-dev lld llvm ninja-build patch perl pkgconf \
            python3 python3-cryptography python3-dev python3-packaging python3-pyelftools \
            python3-setuptools qemu-utils rsync swig unzip wget xz-utils zlib1g-dev zstd
          sudo mkdir -p /mnt/a31
          sudo chown "$USER:$USER" /mnt/a31
          ln -s /mnt/a31 wrt
          mkdir -p build-reports
      - name: Install matching Go bootstrap
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go_bootstrap }}
          cache: false
      - name: Fetch original CI source at recorded revision
        working-directory: wrt
        run: |
          git init
          git remote add origin "https://github.com/$SOURCE_REPO.git"
          git fetch --depth=1 origin "$SOURCE_REVISION"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
      - name: Prepare A31 packages and compatibility profile
        run: bash .github/scripts/a31-prepare.sh
      - name: Resolve configuration
        working-directory: wrt
        run: |
          python3 "$GITHUB_WORKSPACE/.github/scripts/a31-config.py" seed
          bash "$GITHUB_WORKSPACE/.github/scripts/prepare-build-host.sh"
          make defconfig
          python3 "$GITHUB_WORKSPACE/.github/scripts/a31-config.py" packages
          make defconfig
          python3 "$GITHUB_WORKSPACE/.github/scripts/a31-config.py" audit
          ./scripts/diffconfig.sh > "$GITHUB_WORKSPACE/build-reports/resolved.diffconfig"
          cp .config "$GITHUB_WORKSPACE/build-reports/resolved.config"
      - name: Upload configuration audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: a31-${{ matrix.source }}-config-${{ github.run_attempt }}
          path: build-reports/
          include-hidden-files: true
          retention-days: 30
      - name: Cache downloads and compiler cache
        if: ${{ !inputs.config_only }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /mnt/a31/dl
            /mnt/a31/.ccache
          key: a31-${{ matrix.source }}-${{ matrix.revision }}-${{ github.run_id }}
          restore-keys: a31-${{ matrix.source }}-${{ matrix.revision }}-
      - name: Download sources
        if: ${{ !inputs.config_only }}
        working-directory: wrt
        run: make download -j8 || make download -j1 V=s
      - name: Compile firmware
        if: ${{ !inputs.config_only }}
        working-directory: wrt
        run: |
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/build-reports/build.log" || \
            make -j1 V=s 2>&1 | tee -a "$GITHUB_WORKSPACE/build-reports/build.log"
      - name: Preserve native build output
        if: ${{ success() && !inputs.config_only }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: a31-${{ matrix.source }}-raw-build
          path: wrt/bin/targets/mediatek/filogic/
          if-no-files-found: error
          retention-days: 30
      - name: Verify and collect firmware
        if: ${{ !inputs.config_only }}
        working-directory: wrt
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/a31-config.py" collect
      - name: Upload firmware and metadata
        if: ${{ success() && !inputs.config_only }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: a31-${{ matrix.source }}-firmware
          path: a31-artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Upload build diagnostics
        if: ${{ always() && !inputs.config_only }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: a31-${{ matrix.source }}-diagnostics-${{ github.run_attempt }}
          path: |
            build-reports/
            wrt/logs/
          include-hidden-files: true
          retention-days: 30
